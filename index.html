<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dig Deep: a 2D mining and building sandbox. Dig down, collect ores, craft better pickaxes and build a base, right in your browser." />
    <meta name="theme-color" content="#2e5f8f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Dig Deep</title>

    <!-- Link previews (Discord, Slack, iMessage, X, ...). Preview URLs must be absolute, so
         update these if the game moves off https://swalliso.github.io/dig-deep/. -->
    <link rel="canonical" href="https://swalliso.github.io/dig-deep/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dig Deep" />
    <meta property="og:title" content="Dig Deep" />
    <meta property="og:description" content="Dig down, collect ores, craft better pickaxes and build a base. A 2D mining sandbox that runs right in your browser." />
    <meta property="og:url" content="https://swalliso.github.io/dig-deep/" />
    <meta property="og:image" content="https://swalliso.github.io/dig-deep/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pixel-art scene: grassy hills with trees above a torch-lit cave, where a miner stands among coal, copper, iron and gold ore." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dig Deep" />
    <meta name="twitter:description" content="Dig down, collect ores, craft better pickaxes and build a base. A 2D mining sandbox that runs right in your browser." />
    <meta name="twitter:image" content="https://swalliso.github.io/dig-deep/og-image.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        cursor: crosshair;
      }

      /* Title / pause menus, drawn over the canvas. */
      #ui {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: #fff;
      }
      #ui.open {
        display: flex;
      }
      #ui.title {
        background: linear-gradient(#2e5f8f 0%, #5fa8e8 38%, #5a9e3a 38.5%, #6b4426 40%, #24170e 75%, #0b0806 100%);
      }
      #ui.pause {
        background: rgba(0, 0, 0, 0.55);
      }
      #ui .menu {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(360px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 24px 26px;
        background: rgba(18, 18, 26, 0.92);
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.45);
      }
      #ui h1 {
        margin: 0;
        font-size: 44px;
        letter-spacing: 6px;
        text-align: center;
        color: #ffd27a;
        text-shadow: 4px 4px 0 #6b3d14;
      }
      #ui h2 {
        margin: 0 0 6px;
        font-size: 24px;
        text-align: center;
      }
      #ui .sub {
        margin: 0 0 10px;
        text-align: center;
        color: #9a9aa6;
        font-size: 13px;
      }
      #ui button {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font: inherit;
        font-size: 16px;
        padding: 10px 14px;
        color: #fff;
        text-align: left;
        background: #3a3a48;
        border: 2px solid #55556a;
        cursor: pointer;
      }
      #ui button:hover:not(:disabled),
      #ui button:focus-visible {
        background: #4a4a5e;
        border-color: #a0a0c0;
        outline: none;
      }
      #ui button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #ui button.danger {
        border-color: #d0603c;
        background: #5a2c22;
      }
      #ui button.small {
        font-size: 12px;
        padding: 6px 10px;
        color: #c8c8d6;
      }
      #ui .devtag {
        align-self: center;
        margin: -4px 0 6px;
        padding: 2px 8px;
        font-size: 12px;
        letter-spacing: 2px;
        color: #1a1208;
        background: #ffb347;
      }
      #ui .detail {
        font-size: 12px;
        color: #b8b8c8;
      }
      #ui .note {
        margin: 0;
        font-size: 13px;
        color: #ff9a7a;
      }
      #ui label {
        margin-top: 6px;
        font-size: 13px;
        color: #b8b8c6;
      }
      #ui input {
        font: inherit;
        font-size: 15px;
        padding: 8px 10px;
        color: #fff;
        background: #0e0e14;
        border: 2px solid #55556a;
      }
      #ui input:focus {
        border-color: #a0a0c0;
        outline: none;
      }
      #ui table {
        border-collapse: collapse;
        font-size: 14px;
        margin-bottom: 8px;
      }
      #ui .menu:has(table) {
        width: min(460px, calc(100vw - 32px));
      }
      #ui td {
        white-space: nowrap;
        padding: 5px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      #ui td:last-child {
        color: #ffd27a;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
